info:
  name: Puxar produtos por preço
  type: http
  seq: 4

http:
  method: GET
  url: http://127.0.0.1:8000/produtos?preco=(valor)
  params:
    - name: preco
      value: (valor)
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
