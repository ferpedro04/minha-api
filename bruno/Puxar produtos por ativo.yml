info:
  name: Puxar produtos por ativo
  type: http
  seq: 3

http:
  method: GET
  url: http://127.0.0.1:8000/produtos?ativo=(true ou false)
  params:
    - name: ativo
      value: (true ou false)
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
