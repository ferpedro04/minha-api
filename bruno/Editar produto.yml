info:
  name: Editar produto
  type: http
  seq: 7

http:
  method: PUT
  url: http://127.0.0.1:8000/produtos/2
  body:
    type: json
    data: |-
      {
        "nome": "nome",
        "preco": (valor),
        "ativo": (true ou false)
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
