info:
  name: Editar produto
  type: http
  seq: 3

http:
  method: PUT
  url: http://127.0.0.1:8000/produtos/id
  body:
    type: json
    data: |-
      {
        "id": (numero),
        "nome": "(nome)",
        "preco": (valor),
        "ativo": (true ou false)
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
