info:
  name: Puxar produtos por preço e ativo
  type: http
  seq: 5

http:
  method: GET
  url: http://127.0.0.1:8000/produtos?preco=(valor)&ativo=(true ou false)
  params:
    - name: preco
      value: (valor)
      type: query
    - name: ativo
      value: (true ou false)
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
